
apiVersion: apps/v1
kind: Deployment
metadata:
  name: texttospeech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: texttospeech
  template:
    metadata:
      labels:
        app: texttospeech
    spec:
      containers:
        - name: texttospeech
          image: pranithapadtham/texttospeech:kubeimage1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
